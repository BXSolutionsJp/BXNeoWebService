<script type="text/javascript">


function ChkJanCode(){
	var JanCode = document.getElementById("JAN").value;
	
		window.alert(JanCode);

//    var url = "http://192.168.6.7/SlpWebService/HT.asmx";

    SOAPClient.invoke(url, "getHKAT", pl, false, SOAP_callBack);

function SOAP_callBack(r) {

    	window.alert("NoData");
        window.alert("無効な担当コードです。");        

        return;
    }
	
	
	
	window.alert(r.length);
	

}
